{% extends "base.html" %}
{% block content %}

{% if user %}
<div class="card mb-4">
    <div class="card-body">
        <h5>Добавить анекдот</h5>
        <form action="/anecdote/new" method="post">
            <textarea name="content" class="form-control mb-2" required placeholder="Текст анекдота..."></textarea>
            <button class="btn btn-primary btn-sm">Опубликовать</button>
        </form>
    </div>
</div>
{% else %}
<div class="alert alert-info">Чтобы добавлять и оценивать анекдоты, <a href="/user/login">войдите</a>.</div>
{% endif %}

<h3>Лента анекдотов</h3>
{% for joke in anecdotes %}
<div class="card mb-3">
    <div class="card-body">
        <p class="fs-5">{{ joke.content }}</p>
        <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted">Рейтинг: {{ joke.likes_count }}</small>
            
            {% if user %}
            <div class="btn-group">
                <!-- Лайк -->
                <form action="/interaction/rate/{{ joke.id }}" method="post" class="d-inline">
                    <input type="hidden" name="value" value="1">
                    <button class="btn btn-outline-success btn-sm">+</button>
                </form>
                <!-- Дизлайк -->
                <form action="/interaction/rate/{{ joke.id }}" method="post" class="d-inline ms-1">
                    <input type="hidden" name="value" value="-1">
                    <button class="btn btn-outline-danger btn-sm">-</button>
                </form>
                <!-- Избранное -->
                <form action="/interaction/favorite/{{ joke.id }}" method="post" class="d-inline ms-2">
                    <button class="btn btn-outline-warning btn-sm">🌟</button>
                </form>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
